name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verification gate (same as local: tsc + tests + build)
        run: |
          npx tsc --noEmit
          npm test -- --run
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages builds via GitHub Actions (idempotent)
        uses: actions/github-script@v7
        with:
          script: |
            // The owner's gh OAuth token cannot write Pages settings (API returns 404),
            // but this workflow's GITHUB_TOKEN has pages:write — set the build source here.
            await github.rest.repos.updateInformationAboutPagesSite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow',
            });

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
