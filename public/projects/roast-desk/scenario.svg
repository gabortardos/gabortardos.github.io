<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">The Roast Desk Make.com scenario overview</title>
<desc id="desc">Presentation-friendly reconstruction of the current Make.com scenario showing the main Telegram joke flow, welcome and help branches, logging, usage tracking, and admin statistics routes.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
  <style>
    .h1{font:700 36px Arial,sans-serif;fill:#111827}
    .sub{font:400 18px Arial,sans-serif;fill:#6b7280}
    .label{font:700 16px Arial,sans-serif;fill:#1f2937}
    .small{font:400 13px Arial,sans-serif;fill:#6b7280}
    .num{font:700 12px Arial,sans-serif;fill:#fff}
    .flow{fill:none;stroke:#a8b1bd;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dash{fill:none;stroke:#b7c1cc;stroke-width:3;stroke-dasharray:7 8;stroke-linecap:round;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1800" height="1100" fill="#f8fafc"/>
<text x="55" y="58" class="h1">THE ROAST DESK — MAKE.COM SCENARIO MAP</text>
<text x="55" y="90" class="sub">A readable reconstruction of the current working scenario. Module numbers shown where confirmed.</text>

